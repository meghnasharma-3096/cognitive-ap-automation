# One-click free hosting on Render: New > Blueprint > pick this repo/branch.
services:
  - type: web
    name: cognitive-ap-automation
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: fixture        # replay mode: no key needed. Remove it and add GEMINI_API_KEY to go live.
